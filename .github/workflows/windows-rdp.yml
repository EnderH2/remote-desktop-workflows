name: WINDOWS RDP - CLOUDFLARE

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Write-Host "Enabling RDP..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Write-Host "✅ RDP Enabled!"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password Configured!"

      - name: Start Cloudflare Tunnel
        run: |
          Write-Host "============================================"
          Write-Host "🚀 Starting Cloudflare Tunnel"
          Write-Host "============================================"
          Write-Host ""
          
          # Start cloudflared and capture output to a file
          Start-Process -NoNewWindow -FilePath "cloudflared" -ArgumentList "tunnel --url tcp://localhost:3389 --protocol http2" -RedirectStandardOutput "tunnel.log" -RedirectStandardError "tunnel_error.log"
          
          Write-Host "⏳ Waiting for tunnel to start (35 seconds)..."
          Start-Sleep -Seconds 35
          
          # Read the log file
          $logContent = Get-Content "tunnel.log" -Raw -ErrorAction SilentlyContinue
          $errorLog = Get-Content "tunnel_error.log" -Raw -ErrorAction SilentlyContinue
          
          # Try to find the tunnel URL
          if ($logContent -match "https://([a-zA-Z0-9-]+)\.trycloudflare\.com") {
              $tunnelUrl = $matches[0]
              Write-Host ""
              Write-Host "============================================"
              Write-Host "✅✅✅ TUNNEL URL FOUND ✅✅✅"
              Write-Host "============================================"
              Write-Host "🔗 $tunnelUrl"
              Write-Host "============================================"
              Write-Host ""
              Write-Host "📋 CONNECTION DETAILS:"
              Write-Host "   URL: $tunnelUrl"
              Write-Host "   USERNAME: runneradmin"
              Write-Host "   PASSWORD: P@ssw0rd123!"
              Write-Host "   PORT: 3389"
              Write-Host "============================================"
          } else {
              Write-Host ""
              Write-Host "⚠️ URL not found in logs. Showing full log:" -ForegroundColor Yellow
              Write-Host ""
              Write-Host "=== TUNNEL LOG ==="
              Write-Host $logContent
              Write-Host ""
              Write-Host "=== ERROR LOG ==="
              Write-Host $errorLog
          }
          
          Write-Host ""
          Write-Host "⏳ Keeping session alive..."
          while ($true) {
              Write-Host "✓ Active - $(Get-Date -Format 'HH:mm:ss')"
              Start-Sleep -Seconds 60
          }
